<!DOCTYPE html>
<html>
  <head>
    <title>DOM-projects</title>
    <style>
        body {
          font-family: Arial;
        }
       .subscribe-button {
        border: none;
        background-color: black;
        color: white;
        padding: 10px 15px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 30px;
      } 

      .is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
      }

      .cost-input {
        font-size: 15px;
        padding: 10px;
      }

      .calculate-button {
        border: none;
        background-color: green;
        color: white;
        padding: 12px 15px;
        font-size: 15px;
        cursor: pointer;
      }


    </style>
  </head>

  <body>
    <p>Youtube Subscribe Button</p>
    <button class="js-subscribe-button subscribe-button" onclick="
    subscirbe();
    ">Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <input class="js-cost-input cost-input" onkeydown="handleCostKeydown(event);" type="text" placeholder="Cost of order">
    <button class="calculate-button" onclick="
    calculateTotal();
    ">Calculate</button>
    <p class="js-total-cost"></p>
     
    <script>
      String(25)
      console.log('25' - 5);
      console.log('25' + 5);

      window.document
      window.console.log('window');
      


      function handleCostKeydown (event) {
         if (event.key === 'Enter') {
          calculateTotal();
        }
      }


      function calculateTotal () {
        const inputElement = document.querySelector('.js-cost-input');

        let cost = Number(inputElement.value);

        console.log(cost);
        console.log(typeof cost);

        if (cost < 40) {
          cost = cost + 10;
          console.log(cost);
        }

        document.querySelector('.js-total-cost').innerHTML = `$${cost}`
      }

     function subscirbe() {
      const buttonElement = document.querySelector('.js-subscribe-button');

      if (buttonElement.innerText === 'Subscribe') {
        buttonElement.innerHTML = 'Subscribed';
        buttonElement.classList.add('is-subscribed');
      } else {
        buttonElement.innerHTML = 'Subscribe';
        buttonElement.classList.remove('is-subscribed');
      }
     }


    </script>

  </body>
</html>
